# LuaProxy / DMP 网关 —— nginx 配置
#
# 相对 2017 年版本的修正集中在本文件的几处，均已在注释中标出。

lua_package_path '/data/modules/openresty/lualib/?.lua;/data/modules/openresty/lualib/?/init.lua;/data/modules/openresty/site/lualib/?.lua;/data/modules/openresty/webapps/?.lua;;';
lua_package_cpath '/data/modules/openresty/lualib/?.so;/data/modules/openresty/webapps/resty/so/?.so;;';

lua_shared_dict dataDict 50m;
lua_shared_dict cassandra_lock 2m;

# 启动期完成配置校验 + 适配器注册；任一不合规则 nginx 拒绝启动
init_by_lua_file      /data/modules/openresty/webapps/init.lua;
init_worker_by_lua_file /data/modules/openresty/webapps/init_worker.lua;

# nginx 不读 /etc/hosts，域名解析需显式配置。
# 原版硬编码了公网 DNS（180.76.76.76 / 8.8.8.8）——生产环境应使用内网 DNS。
resolver 127.0.0.1 valid=300s ipv6=off;
resolver_timeout 5s;

# 通用反代通道的上游。目标主机必须同时在 conf/system.lua 的 upstreams 中登记，
# 调用方只传名字，不传 host —— 这是修复 SSRF 的关键。
upstream partner_proxy {
     server partner.example.com:443;
     keepalive 64;
}

server {
    listen       8083 reuseport;
    server_name  api.example.com;

    charset utf-8;
    chunked_transfer_encoding off;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY    always;
    add_header Referrer-Policy        no-referrer always;

    # ---- 请求体上限 ----
    # 必须 >= conf/config.lua 的 max_body_bytes，否则大请求会被 nginx 先拒掉，
    # Lua 层永远拿不到，也就无法给出精确的错误码。
    client_max_body_size    64k;
    client_body_buffer_size 64k;
    client_body_timeout     5s;
    client_header_timeout   5s;
    # 客户端断开时主动结束对上游的请求，避免 worker 空转
    lua_check_client_abort on;

    # ---- 限流（按调用方 IP，可按需调整 rate）----
    # 原版完全没有限流，配合 SSRF 漏洞等于一个可被用来打满内网的入口。
    limit_req_zone  $binary_remote_addr zone=dmp_api:10m rate=200r/s;
    limit_req_status 429;

    # ---- 主入口 ----
    location /api {
        limit_req zone=dmp_api burst=100 nodelay;

        default_type application/json;
        content_by_lua_file /data/modules/openresty/webapps/api.lua;
        log_by_lua_file     /data/modules/openresty/webapps/lib/logger.lua;
    }

    # ---- 签名入口（可选，需要 auth_keys 配置）----
    location /apis {
        limit_req zone=dmp_api burst=50 nodelay;

        default_type application/json;
        content_by_lua_file /data/modules/openresty/webapps/apis.lua;
        log_by_lua_file     /data/modules/openresty/webapps/lib/logger.lua;
    }

    # ---- 健康检查（不暴露内部状态，仅供存活探测）----
    location = /healthz {
        default_type text/plain;
        content_by_lua_block {
            ngx.say("ok")
        }
        access_log off;
    }

    # ---- 排障接口（建议仅在内网 / 鉴权后开放）----
    location = /_dmp/status {
        default_type application/json;
        content_by_lua_block {
            local DMP = _G.DMP
            if not DMP then
                ngx.status = 503
                ngx.say('{"ok":false}')
                return
            end
            local cjson = require "cjson.safe"
            local names, warnings = {}, {}
            for _, n in ipairs(DMP.cfg.dmp) do names[#names+1] = n end
            for _, w in ipairs(DMP.warnings or {}) do warnings[#warnings+1] = w end
            ngx.say(cjson.encode({
                ok = true,
                sources = names,
                upstreams = (function()
                    local u = {}
                    for k in pairs(DMP.cfg.upstreams) do u[#u+1] = k end
                    table.sort(u)
                    return u
                end)(),
                warnings = warnings,
                uptime_s = math.floor(ngx.now()),
            }))
        }
        access_log off;
    }

    # ---- 通用反代通道 ----
    #
    # 目标主机由 Lua 层的白名单决定，绝不接受请求参数直接拼接。
    # rewrite 把 /proxy/<scheme>/<alias><path> 归一化后交给 proxy_pass，
    # <alias> 必须命中下面已声明的 upstream 名。
    location /proxy/ {
        internal;
        rewrite ^/proxy/(http|https)/([A-Za-z0-9_\-]+)(/.*)?$ /$3 break;
        proxy_pass $1://$2;

        proxy_http_version 1.1;
        proxy_redirect     off;

        # 清空 Connection 交给 keepalive 池管理。
        # 原版这里是 `proxy_set_header Connection "";`
        proxy_set_header Connection "";
        # 修正：原版把 403 / 404 也算作 next_upstream 触发条件。
        # 4xx 是业务语义而非节点故障，重试只会放大延迟并可能重复计数。
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_connect_timeout 300ms;
        proxy_read_timeout    800ms;
        proxy_send_timeout    800ms;

        proxy_buffer_size       64k;
        proxy_buffers          4 64k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;

        proxy_ignore_client_abort on;

        # HTTPS 上游必须开 SNI 与证书校验，
        # 否则 nginx 会把请求发到默认 vhost 上（可能拿到错误的站点）。
        proxy_ssl_server_name   on;
        proxy_ssl_session_reuse on;
        proxy_ssl_protocols     TLSv1.2 TLSv1.3;
    }

    access_log  /data/logs/dmpapi.access.log;
    error_log   /data/logs/dmpapi.error_log warn;
}
